name: Deploy website and documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Picks up a new VISTA release's docs within a day.
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      # The Reference pages are VISTA's docs/ as of its latest release (never a
      # pre-release), which is what researchers have installed.
      - name: Find the latest VISTA release
        id: vista
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh release view --repo Genesis-VISTA/vista --json tagName --jq .tagName)" >> "$GITHUB_OUTPUT"

      - name: Check out VISTA's docs at that release
        uses: actions/checkout@v4
        with:
          repository: Genesis-VISTA/vista
          ref: ${{ steps.vista.outputs.tag }}
          path: _vista
          sparse-checkout: |
            docs
            scripts/docs_site

      # The release carries the script and manifest that publish it.
      - name: Copy VISTA's docs into the Reference section
        run: python _vista/scripts/docs_site/sync_docs.py _vista . --ref "${{ steps.vista.outputs.tag }}"

      - name: Assemble website
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R assets _site/assets
          touch _site/.nojekyll
          mkdocs build --strict -f mkdocs.generated.yml --site-dir _site/docs

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
