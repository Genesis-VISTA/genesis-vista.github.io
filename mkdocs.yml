site_name: VISTA Documentation
site_description: Documentation for the Visual Intelligence for Scientific & Tooling Assistant
site_url: https://genesis-vista.github.io/docs/
docs_dir: documentation

theme:
  name: material
  features:
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Quick Start Guide: quick-start.md
  - How to use VISTA: index.md
  - Tutorials:
      - LLM modeling: llm-modeling.md
      - Alloy design: alloy-design.md
      - Create your own ModSim skill: modsim-skill.md
      - Lux skills: lux-llm.md

validation:
  anchors: warn

# The Reference and Developers sections are added by VISTA's
# scripts/docs_site/sync_docs.py from its docs/site.toml, into
# mkdocs.generated.yml, which is what the workflow builds. VISTA's
# scripts/docs_site/mkdocs.yml mirrors this file's theme and markdown_extensions,
# so keep them in step:
# https://github.com/Genesis-VISTA/vista/blob/main/scripts/docs_site/mkdocs.yml
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

extra:
  homepage: https://genesis-vista.github.io/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Genesis-VISTA

copyright: VISTA — an evolving scientific research initiative
